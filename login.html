<!doctype html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login</title><script src='https://cdn.tailwindcss.com'></script><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='supabase-config.js'></script><script defer src='app.js'></script></head><body class='bg-[#f8f3e8] min-h-screen flex items-center justify-center p-5'><form id='loginForm' class='w-full max-w-sm bg-white rounded-3xl shadow-xl p-6'><h1 class='text-2xl font-semibold'>เข้าสู่ระบบ</h1><input id='email' type='email' required placeholder='Email' class='mt-5 w-full border rounded-xl p-3'><button class='mt-4 w-full rounded-xl bg-[#2f4a34] text-white p-3'>ส่งลิงก์เข้าสู่ระบบ</button><p id='msg' class='text-sm mt-3 text-stone-600'></p><a class='text-sm underline mt-3 inline-block' href='signup.html'>สมัครสมาชิก</a></form><script>loginForm.onsubmit=async(e)=>{e.preventDefault();const email=email.value;const {error}=await supabaseClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/index.html'}});msg.textContent=error?error.message:'ส่งลิงก์เรียบร้อยแล้ว';}</script></body></html>
