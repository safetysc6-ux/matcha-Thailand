<!doctype html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin Matcha</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css' rel='stylesheet'><link href='assets/css/styles.css' rel='stylesheet'></head><body class='admin-shell'>
<main class='container section-space'>
<h2 class='section-title mb-3'>Admin Matcha Studio</h2>
<p class='mb-4 opacity-75 small' id='adminGateMsg'>กำลังตรวจสอบสิทธิ์...</p>
<div id='adminContent' class='d-none'>
  <section class='premium-card p-3'>
    <div class='d-flex justify-content-between align-items-center mb-2'>
      <h5 class='mb-0'>จัดการสูตร (Recipe Management)</h5>
      <button class='btn btn-premium' id='newRecipeBtn'><i class='bi bi-plus-circle me-1'></i>เพิ่มสูตร</button>
    </div>
    <div id='recipeAdminList' class='mt-2'></div>
  </section>
</div></main>

<div class='modal fade' id='recipeModal' tabindex='-1'>
  <div class='modal-dialog modal-dialog-scrollable modal-lg modal-fullscreen-sm-down'>
    <div class='modal-content'>
      <div class='modal-header'><h5 class='modal-title' id='recipeModalTitle'>เพิ่มสูตรใหม่</h5><button type='button' class='btn-close' data-bs-dismiss='modal'></button></div>
      <form id='recipeForm'>
        <input type='hidden' name='id'>
        <div class='modal-body'>
          <div class='row g-3'>
            <div class='col-12'><label class='form-label'>ชื่อสูตร</label><input class='form-control' name='title' required></div>
            <div class='col-12'><label class='form-label'>รายละเอียด</label><textarea class='form-control' name='description' rows='2' required></textarea></div>
            <div class='col-12'><label class='form-label'>ส่วนผสม</label><textarea class='form-control' name='ingredients' rows='3' required></textarea></div>
            <div class='col-12'><label class='form-label'>วิธีชง</label><textarea class='form-control' name='brewing_steps' rows='4' required></textarea></div>
            <div class='col-6'><label class='form-label'>ต้นทุน</label><input class='form-control' type='number' step='0.01' name='matcha_cost' required></div>
            <div class='col-6'><label class='form-label'>ราคาขาย</label><input class='form-control' type='number' step='0.01' name='selling_price' required></div>
            <div class='col-12'><label class='form-label'>รูปภาพ (URL)</label><input class='form-control' name='image_url' placeholder='https://...'></div>
            <div class='col-12'><img id='imagePreview' class='recipe-preview' alt='preview'></div>
            <div class='col-8'><label class='form-label'>หมวดหมู่</label><input class='form-control' name='category' placeholder='Latte, Sparkling, Dessert'></div>
            <div class='col-4 d-flex align-items-end'><div class='form-check form-switch mb-2'><input class='form-check-input' type='checkbox' name='featured' id='featured'><label class='form-check-label' for='featured'>Featured</label></div></div>
          </div>
        </div>
        <div class='modal-footer'><button type='button' class='btn btn-outline-secondary' data-bs-dismiss='modal'>ยกเลิก</button><button class='btn btn-premium'>บันทึกสูตร</button></div>
      </form>
    </div>
  </div>
</div>

<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='assets/js/supabase.js'></script><script src='assets/js/admin.js'></script></body></html>
