<!doctype html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin Matcha</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css' rel='stylesheet'><link href='assets/css/styles.css' rel='stylesheet'></head><body class='admin-shell'>
<main class='container section-space'>
<h2 class='section-title mb-3'>Admin Matcha Studio</h2>
<p class='mb-4 opacity-75 small' id='adminGateMsg'>กำลังตรวจสอบสิทธิ์...</p>
<div id='adminContent' class='d-none'>
<div class='row g-3'>
<section class='col-12 col-lg-6'><div class='premium-card p-3'><h5>จัดการสินค้า</h5><form id='productForm' class='row g-2'><div class='col-7'><input class='form-control' id='productName' placeholder='ชื่อสินค้า' required></div><div class='col-5'><input class='form-control' id='productPrice' placeholder='ราคา' required></div><div class='col-12'><button class='btn btn-premium w-100'>บันทึกสินค้า</button></div></form><div id='productAdminList' class='mt-2'></div></div></section>
<section class='col-12 col-lg-6'><div class='premium-card p-3'><h5>จัดการสูตร</h5><form id='recipeForm'><input class='form-control mb-2' id='recipeName' placeholder='ชื่อสูตร' required><textarea class='form-control mb-2' id='recipeDesc' placeholder='รายละเอียด' required></textarea><button class='btn btn-premium w-100'>บันทึกสูตร</button></form><div id='recipeAdminList' class='mt-2'></div></div></section>
</div>
<section class='premium-card p-3 mt-3'><h5>จัดการ Hero หน้าแรก</h5><textarea class='form-control mb-2' rows='3' id='heroContent' placeholder='แก้ไขข้อความ Hero'></textarea><button class='btn btn-premium w-100' id='saveHeroBtn'>บันทึก</button></section>
</div></main>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='assets/js/supabase.js'></script><script src='assets/js/admin.js'></script></body></html>
