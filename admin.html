<!doctype html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin</title><script src='https://cdn.tailwindcss.com'></script><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='supabase-config.js'></script><script defer src='app.js'></script></head><body class='bg-[#f8f3e8] pb-28'><main class='max-w-md mx-auto p-5'><h1 class='text-3xl font-semibold'>Admin Studio</h1><p class='text-sm text-stone-600 mt-2'>จัดการสินค้า สูตร และคอนเทนต์หน้าแรก</p><form id='productForm' class='bg-white rounded-2xl p-4 shadow mt-4 space-y-2'><input id='pname' required placeholder='ชื่อสินค้า' class='w-full border rounded-xl p-3'><input id='pprice' type='number' required placeholder='ราคา' class='w-full border rounded-xl p-3'><button class='w-full rounded-xl bg-[#2f4a34] text-white p-3'>เพิ่มสินค้า</button></form><div id='products' class='space-y-3 mt-4'></div></main><nav id='bottom-nav' class='fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white rounded-2xl p-3 shadow flex justify-around'><a data-page='index.html' href='index.html'>Home</a><a data-page='calculator.html' href='calculator.html'>Cost</a><a data-page='recipes.html' href='recipes.html'>Recipes</a><a data-page='admin.html' href='admin.html'>Admin</a></nav><script>async function checkAdmin(){const user=await getCurrentUser();if(!user){location.href='login.html';return false;}const {data}=await supabaseClient.from('users').select('role').eq('id',user.id).single();if(data?.role!=='admin'){alert('เฉพาะแอดมิน');location.href='index.html';return false;}return true;}async function loadProducts(){const {data}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});products.innerHTML=(data||[]).map(p=>`<div class='bg-white p-4 rounded-2xl shadow flex justify-between'><div><p>${p.name}</p><p class='text-sm text-stone-500'>${thaiCurrency(p.price)}</p></div><button onclick='delProd("${p.id}")'>ลบ</button></div>`).join('');}window.delProd=async(id)=>{await supabaseClient.from('products').delete().eq('id',id);loadProducts();};productForm.onsubmit=async(e)=>{e.preventDefault();await supabaseClient.from('products').insert({name:pname.value,price:Number(pprice.value)});productForm.reset();loadProducts();};checkAdmin().then(ok=>ok&&loadProducts());</script></body></html>
