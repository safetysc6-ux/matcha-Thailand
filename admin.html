<!doctype html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin Dashboard</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='assets/css/styles.css' rel='stylesheet'></head><body><div class='container section-space'><h2 class='section-title mb-4'>Admin Dashboard</h2><div class='admin-grid'><section class='premium-card p-3'><h5>จัดการสินค้า</h5><form id='productForm' class='row g-2'><div class='col-8'><input class='form-control' id='productName' placeholder='ชื่อสินค้า'></div><div class='col-4'><input class='form-control' id='productPrice' placeholder='ราคา'></div><div class='col-12'><button class='btn btn-premium w-100'>เพิ่มสินค้า</button></div></form><ul id='productAdminList' class='mt-3 mb-0'></ul></section><section class='premium-card p-3'><h5>จัดการสูตร</h5><form id='recipeForm'><input class='form-control mb-2' id='recipeName' placeholder='ชื่อสูตร'><textarea class='form-control mb-2' id='recipeDesc' placeholder='รายละเอียด'></textarea><button class='btn btn-premium w-100'>เพิ่มสูตร</button></form><ul id='recipeAdminList' class='mt-3 mb-0'></ul></section></div><section class='premium-card p-3 mt-3'><h5>จัดการเนื้อหาหน้าแรก</h5><textarea class='form-control mb-2' rows='3' id='heroContent' placeholder='แก้ไขข้อความ Hero'></textarea><button class='btn btn-premium' id='saveHeroBtn'>บันทึก</button><p class='small mt-2 mb-0 text-muted'>MVP: เก็บไว้ใน local state และสามารถต่อ Supabase table ได้ทันที</p></section></div><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='assets/js/supabase.js'></script><script src='assets/js/admin.js'></script></body></html>
