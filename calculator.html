<!doctype html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Calculator</title><script src='https://cdn.tailwindcss.com'></script><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='supabase-config.js'></script><script defer src='app.js'></script></head><body class='bg-[#f8f3e8] text-[#222] pb-28'><main class='max-w-md mx-auto p-5'><h1 class='text-3xl font-semibold'>คำนวณต้นทุนมัทฉะ</h1><div id='inputs' class='mt-5 space-y-3'></div><div class='bg-white shadow rounded-2xl p-4 mt-5'><p>ต้นทุนรวม: <b id='cost'>฿0</b></p><p>กำไรต่อแก้ว: <b id='profit'>฿0</b></p><p>เปอร์เซ็นต์กำไร: <b id='margin'>0%</b></p></div></main><nav id='bottom-nav' class='fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white rounded-2xl p-3 shadow flex justify-around'><a data-page='index.html' href='index.html'>Home</a><a data-page='calculator.html' href='calculator.html'>Cost</a><a data-page='recipes.html' href='recipes.html'>Recipes</a><a data-page='admin.html' href='admin.html'>Admin</a></nav><script>const fields=['ราคามัทฉะต่อกรัม','จำนวนกรัมที่ใช้','ค่านม','ค่าแก้ว','ค่าท็อปปิ้ง','ค่าแรง','ราคาขาย'];inputs.innerHTML=fields.map((f,i)=>`<input class='w-full p-3 rounded-xl border' type='number' step='0.01' data-i='${i}' placeholder='${f}'>`).join('');const calc=()=>{const v=[...inputs.querySelectorAll('input')].map(x=>Number(x.value||0));const total=v[0]*v[1]+v[2]+v[3]+v[4]+v[5];const p=v[6]-total;const m=v[6]?p/v[6]*100:0;cost.textContent=thaiCurrency(total);profit.textContent=thaiCurrency(p);margin.textContent=m.toFixed(2)+'%';};inputs.oninput=calc;calc();</script></body></html>
