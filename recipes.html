<!doctype html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Recipes</title><script src='https://cdn.tailwindcss.com'></script><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='supabase-config.js'></script><script defer src='app.js'></script></head><body class='bg-[#f8f3e8] pb-28'><main class='max-w-md mx-auto p-5'><h1 class='text-3xl font-semibold'>สูตรมัทฉะ</h1><form id='recipeForm' class='bg-white rounded-2xl p-4 shadow mt-4 space-y-2'><input id='title' required placeholder='ชื่อสูตร' class='w-full border rounded-xl p-3'><textarea id='steps' required placeholder='วิธีชง' class='w-full border rounded-xl p-3'></textarea><button class='w-full rounded-xl bg-[#2f4a34] text-white p-3'>บันทึกสูตร</button></form><div id='recipes' class='mt-4 space-y-3'></div></main><nav id='bottom-nav' class='fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white rounded-2xl p-3 shadow flex justify-around'><a data-page='index.html' href='index.html'>Home</a><a data-page='calculator.html' href='calculator.html'>Cost</a><a data-page='recipes.html' href='recipes.html'>Recipes</a><a data-page='admin.html' href='admin.html'>Admin</a></nav><script>
let editId=null;
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
async function load(){const {data}=await supabaseClient.from('recipes').select('*').order('created_at',{ascending:false});recipes.innerHTML='';(data||[]).forEach(r=>{const card=document.createElement('article');card.className='bg-white rounded-2xl p-4 shadow';card.innerHTML=`<h3 class='font-semibold'>${esc(r.title)}</h3><p class='text-sm mt-1 whitespace-pre-line'>${esc(r.steps)}</p><div class='mt-2 flex gap-3 text-sm'><button class='edit'>แก้ไข</button><button class='del'>ลบ</button><button class='share'>แชร์</button></div>`;card.querySelector('.edit').onclick=()=>{editId=r.id;title.value=r.title;steps.value=r.steps;window.scrollTo({top:0,behavior:'smooth'});};card.querySelector('.del').onclick=async()=>{await supabaseClient.from('recipes').delete().eq('id',r.id);load();};card.querySelector('.share').onclick=()=>navigator.share?navigator.share({title:r.title,text:r.steps}):alert('เบราว์เซอร์ไม่รองรับ');recipes.appendChild(card);});}
recipeForm.onsubmit=async(e)=>{e.preventDefault();const payload={title:title.value,steps:steps.value};if(editId){await supabaseClient.from('recipes').update(payload).eq('id',editId);editId=null;}else{await supabaseClient.from('recipes').insert(payload);}recipeForm.reset();load();};load();
</script></body></html>
